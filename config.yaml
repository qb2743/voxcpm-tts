  - 。
  - ！
  - ？
  - ；
  - '. '
  - '! '
  - '? '
  - '; '
  - "\n"
  max_segment_chars: 500
  max_concurrent_segments: 5
  min_segment_chars: 2
  pause_between_segments: 0.2
